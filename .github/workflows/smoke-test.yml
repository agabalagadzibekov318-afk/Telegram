name: VelunGram launch smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/smoke-test.yml'
      - '.github/scripts/smoke-test.sh'
  workflow_run:
    workflows: ['Build VelunGram APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-launch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from completed development build
        uses: actions/download-artifact@v4
        with:
          name: VelunGram-APK
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || 40240351875 }}
      - name: Check APK
        run: |
          test -s dist/VelunGram.apk
          ls -lh dist/VelunGram.apk
      - name: Boot Android emulator and test launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh
      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VelunGram-launch-logcat
          path: smoke-test-logs/
          if-no-files-found: ignore
          retention-days: 7
