name: Publish VelunGram direct APK

on:
  workflow_run:
    workflows: ['Build VelunGram APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify build matches current master
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD_SHA" ]; then
            CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
            if [ "$CURRENT" != "$BUILD_SHA" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Skipping outdated build $BUILD_SHA; current master is $CURRENT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Download verified APK from successful build
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "$BUILD_RUN_ID" ]; then
            BUILD_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name VelunGram-APK --dir dist
          test -s dist/VelunGram.apk
          file dist/VelunGram.apk
          ls -lh dist/VelunGram.apk
          sha256sum dist/VelunGram.apk
      - name: Publish direct APK URL
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=velungram-purple-preview
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/VelunGram.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/VelunGram.apk --repo "$GITHUB_REPOSITORY" --title "VelunGram Purple Preview" --notes "Standalone VelunGram APK (Android test build). Features: Velun logo, purple themes, optional Turbo mode. Telegram sample API credentials may prevent login. Test signing key may require uninstalling earlier versions." --prerelease --target master
          fi
